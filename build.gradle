plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
    id 'maven-publish'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Jar: beamlights-<mod version>+<minecraft version>.jar (the mod metadata keeps the plain mod_version).
version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

java {
    withSourcesJar()
    withJavadocJar()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { name = "LatvianModder (KubeJS, Rhino)"; url = "https://maven.latvian.dev/releases"
            content { includeGroup "dev.latvian.mods" } }
}

dependencies {
    // Optional integrations, compile-only (never bundled, never on the dev-run classpath). Jars copied from the pack into
    // libs/ (gitignored). Code touching them is only class-loaded after a ModList check.
    compileOnly files('libs/sodiumdynamiclights-neoforge-1.0.10-1.21.1.jar')
    compileOnly files('libs/omegaflashlight-1.6.6-1.21.1.jar')
    compileOnly files('libs/curios-neoforge-9.5.1+1.21.1.jar')
    // LambDynamicLights: NeoForge runtime + mojmap API, extracted from the nested jars of
    // lambdynamiclights-4.8.11+1.21.1.jar (META-INF/jars/...-neoforge.jar and its nested ...-mojmap.jars: api, yumi,
    // spruceui; the last two only so javac can resolve LambDynLights' supertypes).
    compileOnly files('libs/ldl-neoforge-4.8.11.jar', 'libs/ldl-api-4.8.11.jar', 'libs/ldl-yumi-1.0.0-beta.1.jar',
            'libs/ldl-spruceui-6.2.5.jar')
    compileOnly("dev.latvian.mods:kubejs-neoforge:2101.7.2-build.377") { transitive = false }
    compileOnly("dev.latvian.mods:rhino:2101.2.7-build.85") { transitive = false }

    // Unit tests cover the pure core package (no Minecraft classes).
    // Gson (shipped with Minecraft) for BeamDefinition parsing tests.
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version            : minecraft_version,
            minecraft_version_range      : minecraft_version_range,
            neo_version                  : neo_version,
            loader_version_range         : loader_version_range,
            mod_id                       : mod_id,
            mod_name                     : mod_name,
            mod_license                  : mod_license,
            mod_version                  : mod_version,
            sdl_version_range            : sdl_version_range,
            ldl_version_range            : ldl_version_range,
            omegaflashlight_version_range: omegaflashlight_version_range,
            curios_version_range         : curios_version_range,
            kubejs_version_range         : kubejs_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    from('LICENSE')
}

// Javadoc covers the public API only (it/ratlab/beamlights/api/**).
tasks.named('javadoc', Javadoc).configure {
    include 'it/ratlab/beamlights/api/**'
    options.encoding = 'UTF-8'
    (options as StandardJavadocDocletOptions).addStringOption('Xdoclint:none', '-quiet')
}

// Compile-only jar for other mods: just the API classes (the full jar is needed at runtime).
var apiJar = tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'
    from(sourceSets.main.output) {
        include 'it/ratlab/beamlights/api/**'
    }
    from('LICENSE')
}
tasks.named('assemble') { dependsOn apiJar }

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = 'it.ratlab'
            artifactId = mod_id
            version = mod_version
            from components.java
            artifact apiJar
        }
    }
    repositories {
        maven {
            name = 'buildRepo'
            url = layout.buildDirectory.dir('repo')
        }
        mavenLocal()
    }
}
