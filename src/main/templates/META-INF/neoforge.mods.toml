modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Feffolino/beamlights/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Feffolino/beamlights"
logoFile="beamlights_logo.png"
authors="Rat Lab"
credits="Thanks to the NeoForge, Sodium Dynamic Lights, LambDynamicLights and Omega Flashlight authors."
# Not required on the other side: client light and server spawn blocking each work alone.
displayTest="IGNORE_ALL_VERSION"
description='''
Directional dynamic light for flashlights, helmet lamps and headlights: the beam lights the blocks it hits and the
path along the way. Native Omega Flashlight support, Sodium Dynamic Lights and LambDynamicLights backends.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sodiumdynamiclights"
    type="optional"
    versionRange="${sdl_version_range}"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="lambdynlights"
    type="optional"
    versionRange="${ldl_version_range}"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="omegaflashlight"
    type="optional"
    versionRange="${omegaflashlight_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    versionRange="${curios_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="kubejs"
    type="optional"
    versionRange="${kubejs_version_range}"
    ordering="NONE"
    side="BOTH"
